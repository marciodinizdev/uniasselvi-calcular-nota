<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>De Quanto eu Preciso?</title>
</head>
<body>
    <h1>De Quanto eu Preciso?</h1><br>
    
    <div class="main-container">
        <p style="margin-bottom: 1rem; font-style: italic;">Digite as suas notas para saber quanto precisa tirar na avalização presencial</p>
        <div class="nota nota1">
            <span>Nota da Avaliação I</span>
            <input type="number" name="" id="">
        </div>
        <div class="nota nota2">
            <span>Nota da Avaliação II</span>
            <input type="number" name="" id="">
        </div>
        <div class="nota nota3">
            <span>Nota da Avaliação Discursiva</span>
            <input type="number" name="" id="">
        </div>
        <div class="nota nota4">
            <span>Fez a atividade Valendo 0,50?</span>
            <div class="radios">
                <input type="radio" name="Fiz" id="" value="Fiz">
                <label for="">Fiz</label>
                <input type="radio" name="Não Fiz" id="" value="Não Fiz">
                <label for="">Não Fiz</label>
            </div>
        </div>
        <div class="nota nota-desejada">
            <span>Qual a nota desejada?</span>
            <input type="number" name="" id="">
        </div>
        <div class="nota nota-necessaria">
            <span>
                Para alcançar 7,0 você precisa tirar: 5,00 na avaliação presencial.
            </span>
           
        </div>

    </div>
</body>
</html>
