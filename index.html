<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>De Quanto eu Preciso?</title>
</head>
<body>
    <h1>De Quanto eu Preciso?</h1>
    
    <div class="main-container">
        
        <div class="nota nota1">
            <span>Nota da Avaliação I</span>
            <input type="number" name="" id="">
        </div>
        <div class="nota nota2">
            <span>Nota da Avaliação II</span>
            <input type="number" name="" id="">
        </div>
        <div class="nota nota3">
            <span>Nota da Avaliação Discursiva</span>
            <input type="number" name="" id="">
        </div>
        <div class="nota nota4">
            <span>Fez a Atividade Valendo 0,50?</span>

            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>
        <div class="nota nota-desejada">
            <span>Qual a nota desejada?</span>
            <input type="number" name="" id="">
        </div>
        <input class="calcular" type="button" value="Calcular">
        

    </div>
</body>
</html>
