<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>De Quanto eu Preciso?</title>
</head>
<body>
    <h2>De Quanto eu Preciso?</h2>
    
    <div class="main-container">
        
        <div class="nota">
            <span>Nota da Avaliação I</span>
            <input type="number" name="" id="nota1">
        </div>
        <div class="nota">
            <span>Nota da Avaliação II</span>
            <input type="number" name="" id="nota2">
        </div>
        <div class="nota">
            <span>Nota da Avaliação Discursiva</span>
            <input type="number" name="" id="nota3">
        </div>
        <div class="nota">
            <span>Fez a Atividade Valendo 0,50?</span>

            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
                
            </label>
        </div>
        <div class="nota nota-desejada">
            <span>Média final desejada</span>
            <input type="number" name="" id="" value="7.00">
        </div>
        <input class="calcular" type="button" value="Calcular">
        
        <div class="resultado"></div>

    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close-modal">&times;</button>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
